# Extra mounts for this agent. agent-mgr's template makes exactly one -- this
# agent's home -- and names this file as where an instance adds its own.
#
# The skill is mounted, not fetched. It used to be pinned by SHA and pulled
# from a second repo, and that is precisely what made a half-delivery
# possible: the installer fetched SKILL.md alone and dropped the nested
# scripts/ and references/ the instructions call, so every transform failed
# with "Cannot find module" while reads carried on working -- because reads
# parse data.js directly and never invoke a script. Now the skill and the
# agent are one checkout: `git rev-parse HEAD` is the version, and there is no
# pin to drift.
#
# ${AGENT_DIR}, never "./". agent-mgr passes its own templates/compose.yml as
# the FIRST -f, and Compose resolves relative bind paths against that file's
# directory -- so "./" here would mount agent-mgr's templates. AGENT_DIR comes
# from the registry row and is absolute, the same idiom the template uses for
# AGENT_HOME. It is per-row, so a second person's checkout mounts their own.
#
# Read-only: the agent runs these, it does not edit them.
services:
  hermes:
    volumes:
      - ${AGENT_DIR:?set by agent-mgr from the registry}:/opt/data/skills/productivity/property-hunt:ro
