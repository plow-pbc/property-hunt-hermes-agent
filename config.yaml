# The declarative half of ~/.hermes-property — everything that is a deliberate
# choice for this deployment. Keys equal to the image's own defaults are
# deliberately absent, so the pinned image supplies its current defaults rather
# than a frozen snapshot of them.
model:
  default: gpt-5.6-sol
  provider: openai-codex
# On a full-budget timeout the aux client skips the same-provider retry for
# compression and falls back -- but by default there is nowhere to land, so an
# oversized session freezes and every turn re-stalls. A sibling agent lost ~30h
# to that on 2026-08-31 (plow-pbc/life-assistant-hermes-agent#71); this agent
# runs the same provider and the same image, so it is the same exposure.
#
# The model is pinned, not free-form: a ChatGPT-account codex serves only
# gpt-5.6-sol and gpt-5.5; every other id 400s. Verify a swap by the fallback
# log lines, never the return value -- the implicit main-model fallback reports
# success for a model the account actually rejected. gpt-5.5 was confirmed
# GENUINE against this agent's own auth before landing.
#
# No task-level `timeout` on purpose. The image floors a config-derived
# compression timeout at 300s so a slow reasoning summary is not cut off into
# the deterministic context marker (#54915) -- a lower value is silently raised,
# and setting one that DID bite would re-introduce that bug. A genuinely dead
# stream is caught at 60s by the no-progress timeout, not by this budget.
# The chain entry keeps its own 300s: without one it inherits the 30s auxiliary
# default, far too short for a summary.
auxiliary:
  compression:
    fallback_chain:
    - provider: openai-codex
      model: gpt-5.5
      timeout: 300

mcp_servers:
  # Plow Latch, reached over the Plow relay. This is the whole point of this
  # agent: the browser and the filesystem it works on are the operator's Mac,
  # not this container. The relay authorises the connection and tells the Mac
  # who is asking; the Mac authorises each action.
  #
  # Same shape the rentals agent uses for Hostex: a URL and a bearer header,
  # both from the dotenv. The credential never appears in the URL.
  latch:
    url: https://api.plow.co/v1/relay/devices/${DOMO_DEVICE_UID}/mcp
    headers:
      Authorization: Bearer ${DOMO_MCP_TOKEN}
    enabled: true
plugins:
  enabled:
  - plow-chat-platform
platforms:
  plow_chat:
    enabled: true
    # No extra.group_prompts: this agent has one private chat and no groups.
    # The plugin keys group prompts by display name from PLOW_CHAT_GROUP_UIDS,
    # and a prompt naming no configured group is logged and skipped rather than
    # fatal — so adding one here before the group exists is a silent no-op.
